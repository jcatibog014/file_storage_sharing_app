{# The top of the login and sign-up pages: the app icon, the name and one short line, centred. #}
<a class="login-brand" href="{{ url_for('auth.login') }}">

  <span class="login-name">{{ APP_NAME }}</span>

<p class="login-tagline">Your files, safe and easy to share.</p>
